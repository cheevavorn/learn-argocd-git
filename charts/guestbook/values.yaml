replicaCount: 3

image:
  repository: gcr.io/google-samples/gb-frontend
  tag: v5

service:
  type: LoadBalancer
  port: 8888
  exposeExternal: true

redis:
  architecture: standalone     # ใช้ single node ไม่ใช่ cluster
  auth:
    enabled: false             # ปิด password สำหรับ dev
  image:
    registry: registry-1.docker.io
    repository: bitnamicharts/redis
    tag: 7.4.3-debian-12-r0
  master:
    service:
      ports:
        redis: 6379

env:
  - name: APP_ENV
    value: "local"
  - name: LOG_LEVEL
    value: "info"