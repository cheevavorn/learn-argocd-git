# Service alias ให้ frontend เชื่อมต่อ Redis ด้วยชื่อเดิมได้
apiVersion: v1
kind: Service
metadata:
  name: redis-leader
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: master
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-follower
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: master
  ports:
  - port: 6379
    targetPort: 6379