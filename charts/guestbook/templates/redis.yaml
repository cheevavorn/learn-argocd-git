apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-leader
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-leader
  template:
    metadata:
      labels:
        app: redis-leader
    spec:
      containers:
      - name: redis-leader
        image: {{ .Values.redis.image }}
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-leader
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: redis-leader
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-follower
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: redis-leader
  ports:
  - port: 6379
    targetPort: 6379
