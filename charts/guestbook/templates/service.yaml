apiVersion: v1
kind: Service
metadata:
  name: guestbook-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "guestbook.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "guestbook.selectorLabels" . | nindent 4 }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: 80
  {{- if .Values.service.exposeExternal }}
  type: LoadBalancer
  {{- else }}
  type: ClusterIP
  {{- end }}
