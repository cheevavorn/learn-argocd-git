apiVersion: v1
kind: Service
metadata:
  name: guestbook-ui
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: guestbook-ui
  ports:
  - port: {{ .Values.service.port }}
    targetPort: 80
  {{- if .Values.service.exposeExternal }}
  type: LoadBalancer
  {{- else }}
  type: ClusterIP
  {{- end }}
