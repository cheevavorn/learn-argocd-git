global:
  security:
    allowInsecureImages: true

replicaCount: 1

service:
  exposeExternal: true

redis:
  image:
    registry: docker.io
    repository: bitnami/redis
    tag: latest
  architecture: standalone
  auth:
    enabled: false
  master:
    service:
      ports:
        redis: 6379

env:
- name: APP_ENV
  value: "local"
- name: LOG_LEVEL
  value: "debug"