apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps
    targetRevision: HEAD
    path: guestbook
  # TODO: เปลี่ยน repoURL เป็น repo ของเราหลัง gh auth login
  # repoURL: https://github.com/<your-username>/learn-argocd-git
  destination:
    server: https://kubernetes.default.svc
    namespace: guestbook
  syncPolicy:
    automated:
      prune: true       # ลบ resource ที่ไม่อยู่ใน git แล้ว
      selfHeal: true    # sync กลับถ้ามีคนแก้ตรง cluster
    syncOptions:
    - CreateNamespace=true
