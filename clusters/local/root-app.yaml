apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
  # App of Apps: ArgoCD ดูแล Application อื่นๆ ผ่าน Git
  # ถ้าลบ Application ออกจาก Git → ArgoCD ลบออกจาก cluster ด้วย
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/cheevavorn/learn-argocd-git
    targetRevision: HEAD
    path: apps/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
