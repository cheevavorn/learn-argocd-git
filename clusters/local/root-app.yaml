apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
  # App of Apps: ArgoCD ดูแล Application อื่นๆ ผ่าน Git
  # ถ้าลบ Application ออกจาก Git → ArgoCD ลบออกจาก cluster ด้วย
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps
    targetRevision: HEAD
    path: apps  # ชี้ไปที่โฟลเดอร์ที่เก็บ Application manifests ทั้งหมด
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
